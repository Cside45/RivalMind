name: Check and build (manual distribution only)

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run stdlib tests
        run: python -m unittest discover -s tests -v

  build-windows:
    needs: tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build Windows GUI executable (unsigned alpha)
        run: |
          python -m pip install --disable-pip-version-check pyinstaller==6.16.0
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name RivalMindCompanion companion/rivalmind.py
      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/RivalMindCompanion.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  RivalMindCompanion.exe" | Set-Content -Encoding ascii dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: RivalMind-Windows-alpha-UNSIGNED
          path: |
            dist/RivalMindCompanion.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

# This workflow does NOT publish a release or auto-update. A maintainer must
# review artifacts, sign the binary (when ready), and publish immutable Releases.
